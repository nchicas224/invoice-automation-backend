# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - invoice-automation-app

on:
  push:
    branches:
      - dev
      - 'feature/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'invoice-automation-app' # set this to the path to your web app project, defaults to the repository root
  PYTHON_VERSION: '3.12' # set this to the python version to use (supports 3.6, 3.7, 3.8)

jobs:
  BuildDeploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #Required for federated token
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show current directory and contents
        run: |
          echo "Current directory:"
          pwd
          echo "Contents:"
          ls -la

      - name: 'Resolve Project Dependencies Using Pip'
        shell: bash
        run: |
          echo "Current directory:"
          pwd
          echo "Contents:"
          ls -la
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
          echo "Zipping function app contents..."
          zip -r release.zip . -x "venv/*" ".venv/*" ".git/*" ".vscode/*" "__pycache__/*" "*.pyc" "*.pyo" "*.pyd"
          du -h release.zip
          unzip -l release.zip | sed -n '1,40p'
          unzip -l release.zip | grep -E "host\.json|function_app\.py" || { echo "Missing files in zip"; exit 1;}

      - name: Import smoke test
        shell: bash
        run: |
          echo "Testing import of function_app.py"
          set -ex
          PYTHONPATH=.python_packages/lib/site-packages:. python -c "import function_app"

      - name: Upload Artifact (packaged app)
        uses: actions/upload-artifact@v4
        with:
          name: function-app-release
          path: release.zip
          if-no-files-found: error
          retention-days: 7

      - name: Download Artifact (packaged app)
        uses: actions/download-artifact@v4
        with:
          name: function-app-release
          path: ./dist
      
      - name: Inspect downloaded artifact
        run: |
            ls -la ./dist
            unzip -l ./dist/release.zip | head -n 40
      
        
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Clear stale Run-From-Package settings (if any)
        run: |
          az functionapp config appsettings delete \
          --resource-group rg-invoice-automation \
          --name invoice-automation-app \
          --slot staging \
          --setting-names WEBSITE_RUN_FROM_PACKAGE SCM_RUN_FROM_PACKAGE || true

      - name: Upload package to Blob (explicit)
        id: upload_rfp
        env:
          SA_NAME: rginvoiceautomationb34a
          CONTAINER: function-releases
        run: |
          set -euxo pipefail
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA=$(sha256sum ./dist/release.zip | cut -d' ' -f1 | cut -c1-12)
          NAME="${TS}-${GITHUB_RUN_ID}-${SHA}.zip"

          az storage blob upload \
          --auth-mode login \
          --account-name "$SA_NAME" \
          --container-name "$CONTAINER" \
          --name "$NAME" \
          --file ./dist/release.zip \
          --content-type application/zip \
          --overwrite

          START=$(date -u -d '-5 minutes' +%Y-%m-%dT%H:%M:%SZ)
          EXPIRY=$(date -u -d '+3650 days' +%Y-%m-%dT%H:%M:%SZ)

          set +x
          KEY=$(az storage account keys list -g rg-invoice-automation -n rginvoiceautomationb34a --query "[0].value" -o tsv)
          echo "::add-mask::KEY"
          set -x

          SAS=$(az storage blob generate-sas \
            --account-key "$KEY" --https-only \
            --account-name "$SA_NAME" \
            --container-name "$CONTAINER" \
            --name "$NAME" \
            --permissions r \
            --start "$START" \
            --expiry "$EXPIRY" \
            -o tsv)

          unset KEY

          echo "RFP_URL=https://${SA_NAME}.blob.core.windows.net/${CONTAINER}/${NAME}?${SAS}" >> $GITHUB_ENV

      - name: Sanity Check on URL
        run: |
          echo "RFP_URL = $RFP_URL"
          curl -sI "$RFP_URL" | sed -n '1,8p'
          SIG=$(curl -s --range 0-3 "$RFP_URL" | xxd -p)
          test "$SIG" = "504b0304" || { echo "Not a zip (magic=$SIG)"; exit 1; }

      - name: Point slot to the SAS Package, restart and sync
        run: |
          az functionapp config appsettings set \
          --resource-group rg-invoice-automation \
          --name invoice-automation-app \
          --slot staging \
          --slot-settings WEBSITE_RUN_FROM_PACKAGE="$RFP_URL"

          az functionapp restart --resource-group rg-invoice-automation --name invoice-automation-app --slot staging

      - name: Verify Mounted Package
        run: |
          URL=$(az functionapp config appsettings list \
          --resource-group rg-invoice-automation \
          --name invoice-automation-app \
          --slot staging \
          --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value" -o tsv)
          echo "Mounted RFP URL: $URL"
          curl -sI "$URL" | sed -n '1,6p'
          curl -s --range 0-3 "$URL" | xxd -p
          
      - name: Check release.zip files after deployment
        run: unzip -l ./dist/release.zip | head -n 40   
